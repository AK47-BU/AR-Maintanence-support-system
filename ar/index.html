<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AR Maintenance System</title>
  <script src="/ar/js/api.js"></script>
  <style>
    :root {
      --bg-base:        #0d0f12;
      --bg-panel:       #131619;
      --bg-raised:      #1a1e24;
      --border:         #252c35;
      --border-light:   #2e3740;
      --text-primary:   #e8ecf0;
      --text-secondary: #8a96a3;
      --text-muted:     #4f5a66;
      --accent:         #9d00ac;
      --accent-dim:     rgba(255, 0, 225, 0.12);
      --accent-glow:    rgba(255, 0, 208, 0.3);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-base);
      position: relative;
      overflow: hidden;
    }

    #view-hub {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-base);
      position: relative;
      overflow: hidden;
      gap: 24px;
    }

    .login-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(157, 0, 172, 0.08) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      background: var(--bg-panel);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      animation: slide-up 300ms ease;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo h1 {
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .login-logo p {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    input {
      background: var(--bg-raised);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 12px 16px;
      transition: border-color 150ms ease, box-shadow 150ms ease;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 150ms ease, box-shadow 150ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg-base);
    }

    .btn-primary:hover {
      background: #ff33da;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .footer-text {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
      margin-top: 10px;
    }

    .btn-ghost:hover {
      background: var(--bg-raised);
      color: var(--text-primary);
      border-color: var(--text-muted);
    }

    .error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .hidden { display: none !important; }

    /* Hub */
    .card {
      background: var(--bg-panel);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .user-avatar {
      width: 44px; height: 44px;
      background: var(--accent-dim);
      border: 1px solid rgba(157, 0, 172, 0.3);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }

    .user-info strong {
      display: block;
      font-size: 15px;
      color: var(--text-primary);
    }

    .user-info span {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: capitalize;
    }

    .role-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-left: 6px;
    }
    .role-admin    { background: rgba(239,68,68,0.15);   color: #fca5a5; }
    .role-engineer { background: rgba(157, 0, 172, 0.15); color: #ff33da; }
    .role-viewer   { background: rgba(100,116,139,0.15); color: #94a3b8; }

    .nav-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .nav-card {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 14px;
      text-decoration: none;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.2s, background 0.2s;
    }
    .nav-card:hover {
      border-color: rgba(157, 0, 172, 0.3);
      background: var(--accent-dim);
    }

    .nav-icon { font-size: 26px; }
    .nav-label { font-size: 14px; font-weight: 600; }
    .nav-desc  { font-size: 11px; color: var(--text-muted); }

    .nav-card.fault .nav-icon { color: #f97316; }
    .nav-card.tool  .nav-icon { color: #22c55e; }

    footer {
      margin-top: 24px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Login view -->
  <div id="view-login" class="login-page">
    <div class="login-glow"></div>

    <div class="login-card">
      <div class="login-logo">
        <h1>AR Maintenance</h1>
        <p>Bournemouth Transport — AR Platform</p>
      </div>

      <form id="login-form" class="login-form">
        <div id="login-error" class="error hidden"></div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="input" autocomplete="email"
                 placeholder="user@busdepot.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="input" autocomplete="current-password"
                 placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" id="login-btn">Sign in</button>
      </form>

      <p class="footer-text">Access for authorised personnel only</p>
    </div>
  </div>

  <!-- Hub view (post-login) -->
  <div id="view-hub" class="hidden">
    <div class="card">
      <div class="user-card">
        <div class="user-avatar" id="hub-avatar">ENG</div>
        <div class="user-info">
          <strong id="hub-name">—</strong>
          <span id="hub-role">—</span>
        </div>
      </div>

      <div class="nav-grid">
        <a href="/ar/fault-ar.html" class="nav-card fault">
          <span class="nav-icon">⚠</span>
          <span class="nav-label">Fault Scanner</span>
          <span class="nav-desc">Detect &amp; report faults</span>
        </a>
        <a href="/ar/tool-ar.html" class="nav-card tool">
          <span class="nav-icon">🔧</span>
          <span class="nav-label">Tool Check</span>
          <span class="nav-desc">Track maintenance tools</span>
        </a>
      </div>

      <button class="btn btn-ghost" id="logout-btn">Sign Out</button>
    </div>

    <footer>Connected to AR Maintenance API</footer>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const loginBtn = document.getElementById('login-btn');

    // If already logged in, go straight to hub
    if (Auth.isLoggedIn()) showHub();

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');
      loginBtn.textContent = 'Signing in…';
      loginBtn.disabled = true;

      const data = await API.login(
        document.getElementById('email').value.trim(),
        document.getElementById('password').value
      );

      if (data.success) {
        Auth.save(data.data.token, data.data.user);
        showHub();
      } else {
        loginError.textContent = data.message || 'Login failed. Check your credentials.';
        loginError.classList.remove('hidden');
        loginBtn.textContent = 'Sign In';
        loginBtn.disabled = false;
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      Auth.clear();
      document.getElementById('view-hub').classList.add('hidden');
      document.getElementById('view-login').classList.remove('hidden');
      loginBtn.textContent = 'Sign In';
      loginBtn.disabled = false;
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
    });

    function showHub() {
      const user = Auth.getUser();
      if (!user) return;

      document.getElementById('view-login').classList.add('hidden');
      document.getElementById('view-hub').classList.remove('hidden');

      const initials = user.name
        ? user.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2)
        : 'U';

      document.getElementById('hub-avatar').textContent = initials;
      document.getElementById('hub-name').textContent = user.name || user.email;

      const roleEl = document.getElementById('hub-role');
      roleEl.innerHTML = `
        <span class="role-badge role-${user.role}">${user.role}</span>
        <span style="margin-left:4px;font-size:11px;color:#64748b">${user.depot || ''}</span>
      `;
    }
  </script>
</body>
</html>
