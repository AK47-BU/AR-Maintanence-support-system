<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AR Tool Check</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="/ar/js/api.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { width: 100%; height: 100%; }

    body {
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', system-ui, sans-serif;
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
    }

    a-scene {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
    }

    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
    #ui > * { pointer-events: auto; }

    /* ── Top bar ── */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 52px;
      background: rgba(10,14,26,0.88); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px; color: #e0e6f0; font-size: 14px; font-weight: 600; z-index: 200;
    }
    .topbar-back {
      width: 32px; height: 32px; background: rgba(255,255,255,0.07); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; color: #e0e6f0; font-size: 16px; flex-shrink: 0;
    }

    /* ── Scan hint ── */
    #scan-hint {
      position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%);
      background: rgba(10,14,26,0.82); border: 1px solid rgba(255,255,255,0.08);
      color: #64748b; font-size: 13px; padding: 8px 18px; border-radius: 20px;
      pointer-events: none; white-space: nowrap;
    }

    /* ── Loading bar ── */
    #loading-bar { position: fixed; top: 52px; left: 0; right: 0; height: 2px; background: rgba(34,197,94,0.15); display: none; }
    #loading-fill { height: 100%; background: #22c55e; animation: slide 1s infinite; }
    @keyframes slide { 0%{width:0;margin-left:0} 50%{width:60%;margin-left:20%} 100%{width:0;margin-left:100%} }

    /* ── Tool panel ── */
    #tool-panel {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(10,14,26,0.96); backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255,255,255,0.07); border-radius: 20px 20px 0 0;
      padding-bottom: env(safe-area-inset-bottom, 16px);
      max-height: 75vh;
      transition: transform 0.32s cubic-bezier(.4,0,.2,1);
    }
    #tool-panel.hidden { transform: translateY(110%); }
    #tool-panel.peek   { transform: translateY(calc(100% - 100px)); }

    .panel-drag {
      width: 44px; height: 5px; background: rgba(255,255,255,0.25);
      border-radius: 3px; margin: 12px auto 0;
      cursor: pointer; touch-action: none;
    }


    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px 0;
    }
    .panel-header h3 { font-size: 16px; font-weight: 700; color: #e0e6f0; }

    .count-badge {
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.25);
      color: #86efac; font-size: 14px; font-weight: 700;
      padding: 4px 12px; border-radius: 99px; white-space: nowrap;
    }
    .count-badge.all-done { background: rgba(34,197,94,0.22); }
    .count-badge.missing  { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.3); color: #fca5a5; }

    .check-type-row { padding: 12px 18px 4px; }
    .check-type-row select {
      background: #0a0e1a; border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px; color: #e0e6f0; padding: 10px 12px;
      font-size: 13px; width: 100%; outline: none; font-family: inherit;
    }
    .check-type-row select:focus { border-color: #22c55e; }

    .tool-list { padding: 6px 18px; overflow-y: auto; max-height: calc(75vh - 180px); }

    .tool-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer; user-select: none;
      transition: opacity 0.2s;
    }
    .tool-item:last-child { border-bottom: none; }

    .tool-checkbox {
      width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      font-size: 14px;
    }
    .tool-item.detected .tool-checkbox {
      background: #22c55e; border-color: #22c55e; color: white;
    }
    .tool-item.detected .tool-checkbox::after { content: '✓'; }

    .tool-info { flex: 1; }
    .tool-name { font-size: 14px; color: #e0e6f0; }
    .tool-cat  { font-size: 11px; color: #475569; text-transform: capitalize; margin-top: 1px; }

    .tool-item.detected .tool-name { color: #64748b; }

    .scan-btn {
      padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer;
      font-size: 12px; font-weight: 600; flex-shrink: 0;
      background: rgba(34,197,94,0.1); color: #86efac;
      border: 1px solid rgba(34,197,94,0.2);
      transition: all 0.15s;
    }
    .scan-btn:hover  { background: rgba(34,197,94,0.2); }
    .scan-btn.active { background: #22c55e; color: #0a0e1a; border-color: #22c55e; }

    .tool-item.detected .scan-btn {
      background: rgba(100,116,139,0.1); color: #64748b;
      border-color: rgba(100,116,139,0.2);
    }

    .panel-footer {
      padding: 14px 18px 4px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .btn-submit {
      width: 100%; padding: 13px; border-radius: 10px; border: none;
      font-size: 15px; font-weight: 700; cursor: pointer;
      background: #22c55e; color: #0a0e1a;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Result modal ── */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(6px);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 400; padding: 12px;
    }
    .modal.hidden { display: none; }
    .modal-card {
      background: #111827; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 480px;
      color: #e0e6f0;
    }

    .result-icon { font-size: 48px; text-align: center; margin-bottom: 12px; }
    .result-title { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .result-msg { font-size: 14px; color: #94a3b8; text-align: center; margin-bottom: 20px; }

    .missing-list { margin-bottom: 20px; }
    .missing-item {
      padding: 8px 12px; background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.15); border-radius: 8px;
      font-size: 13px; color: #fca5a5; margin-bottom: 6px;
    }

    .modal-actions { display: flex; gap: 8px; }
    .btn {
      flex: 1; padding: 12px; border-radius: 10px; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #22c55e; color: #0a0e1a; }
    .btn-ghost   { background: rgba(255,255,255,0.07); color: #94a3b8; border: 1px solid rgba(255,255,255,0.08); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: #1e2a3a; color: #e0e6f0; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 10px 18px; font-size: 13px;
      z-index: 500; white-space: nowrap;
    }
    #toast.hidden { display: none; }
    #toast.success { border-color: rgba(34,197,94,0.3); color: #86efac; }
    #toast.error   { border-color: rgba(239,68,68,0.3);  color: #fca5a5; }
  </style>
</head>
<body>

  <!-- face-camera: makes entity's +Z always point toward the camera regardless of marker orientation -->
  <script>
    // always-on-top: disables depth test so text renders over everything
    AFRAME.registerComponent('always-on-top', {
      init: function () {
        var el = this.el;
        function fix() {
          el.object3D.traverse(function (node) {
            if (node.material) {
              node.material.depthTest  = false;
              node.material.depthWrite = false;
              node.renderOrder = 999;
            }
          });
        }
        el.addEventListener('object3dset', fix);
        fix();
        [100, 400, 1000, 2000].forEach(function (d) { setTimeout(fix, d); });
      }
    });

    AFRAME.registerComponent('face-camera', {
      init: function () { this._tgt = new THREE.Quaternion(); },
      tick: function () {
        var obj    = this.el.object3D;
        var camera = this.el.sceneEl.camera;
        if (!camera) return;
        var camPos = new THREE.Vector3();
        var myPos  = new THREE.Vector3();
        camera.getWorldPosition(camPos);
        obj.getWorldPosition(myPos);
        var fwd = camPos.clone().sub(myPos);
        if (fwd.lengthSq() < 0.0001) return;
        fwd.normalize();
        var up  = new THREE.Vector3(0, 1, 0);
        var rgt = new THREE.Vector3().crossVectors(up, fwd).normalize();
        if (rgt.lengthSq() < 0.0001) rgt.set(1, 0, 0);
        up.crossVectors(fwd, rgt).normalize();
        var worldRot = new THREE.Matrix4().makeBasis(rgt, up, fwd);
        if (obj.parent) {
          var parentRotInv = new THREE.Matrix4()
            .extractRotation(obj.parent.matrixWorld).invert();
          worldRot.premultiply(parentRotInv);
        }
        this._tgt.setFromRotationMatrix(worldRot);
        obj.quaternion.slerp(this._tgt, 0.12);
      }
    });

    // hud-frame: draws corner brackets via canvas texture — flush join, curved outer corner
    AFRAME.registerComponent('hud-frame', {
      schema: {
        color:  { type: 'color',  default: '#22c55e' },
        width:  { type: 'number', default: 1.8 },
        height: { type: 'number', default: 1.05 }
      },
      init: function () {
        var W = 512, H = Math.round(W * this.data.height / this.data.width);
        this._W = W; this._H = H;
        this._canvas = document.createElement('canvas');
        this._canvas.width = W; this._canvas.height = H;
        this._ctx = this._canvas.getContext('2d');
        this._tex = new THREE.CanvasTexture(this._canvas);
        var geo = new THREE.PlaneGeometry(this.data.width, this.data.height);
        var mat = new THREE.MeshBasicMaterial({
          map: this._tex, transparent: true, depthWrite: false, side: THREE.DoubleSide
        });
        this._mesh = new THREE.Mesh(geo, mat);
        this.el.object3D.add(this._mesh);
        this._draw();
      },
      update: function () { if (this._ctx) this._draw(); },
      tick: function (t) {
        if (this._mesh) this._mesh.material.opacity = 0.86 + 0.14 * Math.sin(t / 413);
      },
      _draw: function () {
        var W = this._W, H = this._H, ctx = this._ctx;
        ctx.clearRect(0, 0, W, H);
        var lw  = Math.round(W * 0.036);
        var arm = Math.round(W * 0.20);
        var r   = Math.round(W * 0.022);
        var pad = lw / 2 + 1;
        ctx.strokeStyle = this.data.color;
        ctx.lineWidth   = lw;
        ctx.lineCap     = 'butt';
        // TL
        ctx.beginPath();
        ctx.moveTo(pad, pad + arm); ctx.lineTo(pad, pad + r);
        ctx.arcTo(pad, pad, pad + r, pad, r); ctx.lineTo(pad + arm, pad);
        ctx.stroke();
        // TR
        ctx.beginPath();
        ctx.moveTo(W - pad, pad + arm); ctx.lineTo(W - pad, pad + r);
        ctx.arcTo(W - pad, pad, W - pad - r, pad, r); ctx.lineTo(W - pad - arm, pad);
        ctx.stroke();
        // BL
        ctx.beginPath();
        ctx.moveTo(pad, H - pad - arm); ctx.lineTo(pad, H - pad - r);
        ctx.arcTo(pad, H - pad, pad + r, H - pad, r); ctx.lineTo(pad + arm, H - pad);
        ctx.stroke();
        // BR
        ctx.beginPath();
        ctx.moveTo(W - pad, H - pad - arm); ctx.lineTo(W - pad, H - pad - r);
        ctx.arcTo(W - pad, H - pad, W - pad - r, H - pad, r); ctx.lineTo(W - pad - arm, H - pad);
        ctx.stroke();
        this._tex.needsUpdate = true;
      },
      remove: function () {
        this.el.object3D.remove(this._mesh);
        this._mesh.geometry.dispose();
        this._mesh.material.map.dispose();
        this._mesh.material.dispose();
      }
    });
  </script>

  <!-- AR Scene — uses Kanji marker (different from fault scanner's Hiro marker) -->
  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; precision: highp; alpha: true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 720;"
    style="width: 100%; height: 100%; margin: 0; padding: 0; display: block;">

    <a-marker preset="kanji" id="tool-marker" smooth="true" smoothCount="10">
      <a-entity position="0 0.5 0" face-camera scale="1.25 1.25 1.25">

        <!-- Green left strip -->
        <a-plane id="ar-strip"
          color="#22c55e" width="0.08" height="0.95"
          opacity="1" position="-0.82 0 0.01" material="side: double; shader: flat">
        </a-plane>

        <!-- Tool icon (left column) -->
        <a-image id="ar-icon"
          src="/ar/img/icon_none.png"
          width="0.65" height="0.65"
          position="-0.38 0 0.02">
        </a-image>

        <!-- Text (right column) -->
        <a-text id="ar-count" value="TOOL CHECK"
          color="#22c55e" align="left" position="0.08 0.22 0.05"
          width="1.4" font="roboto" negate="false" always-on-top>
        </a-text>

        <a-text id="ar-status" value="Point at tool tray"
          color="#ffffff" align="left" position="0.08 -0.05 0.05"
          width="1.4" font="roboto" negate="false" always-on-top>
        </a-text>

        <a-text id="ar-hint" value="Tap each tool to scan it"
          color="#e0e6f0" align="left" position="0.08 -0.28 0.05"
          width="1.3" font="roboto" negate="false" scale="0.82 0.82 0.82" always-on-top>
        </a-text>

        <!-- Canvas corner brackets — flush join, curved outer corners -->
        <a-entity id="ar-frame" hud-frame="color: #22c55e; width: 1.80; height: 1.05" position="0 0 0.03"></a-entity>

        <!-- Scan line -->
        <a-plane id="ar-scan" color="#22c55e" width="1.80" height="0.032" opacity="0.5"
          position="0 -0.525 0.025" material="shader: flat; side: double"
          animation="property: position; from: 0 -0.525 0.025; to: 0 0.525 0.025; dir: alternate; loop: true; dur: 3200; easing: easeInOutSine">
        </a-plane>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- UI -->
  <div id="ui">
    <div id="topbar">
      <a href="/ar/" class="topbar-back">←</a>
      <span style="flex:1">AR Tool Check</span>
      <span style="font-size:11px;color:#64748b" id="topbar-user"></span>
    </div>

    <div id="loading-bar"><div id="loading-fill"></div></div>

    <div id="scan-hint">Point camera at the Kanji marker</div>

    <!-- Tool check panel -->
    <div id="tool-panel" class="hidden">
      <div class="panel-drag"></div>

      <div class="panel-header">
        <h3>Tool Check</h3>
        <span class="count-badge" id="count-badge">0 / 0</span>
      </div>

      <div class="check-type-row">
        <select id="check-type">
          <option value="pre_shift">Pre-Maintenance Check</option>
          <option value="post_shift">Post-Maintenance Check</option>
          <option value="spot_check">Routine Inspection</option>
        </select>
      </div>

      <div class="tool-list" id="tool-list"></div>

      <div class="panel-footer">
        <button class="btn-submit" id="submit-btn" onclick="submitCheck()">
          Submit Tool Check
        </button>
      </div>
    </div>
  </div>

  <!-- Result modal -->
  <div id="modal-result" class="modal hidden">
    <div class="modal-card">
      <div class="result-icon" id="result-icon">✓</div>
      <div class="result-title" id="result-title">—</div>
      <div class="result-msg"   id="result-msg">—</div>
      <div class="missing-list" id="missing-list"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost"   onclick="closeResult()">Close</button>
        <button class="btn btn-primary" onclick="resetCheck()">New Check</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script>
    // AR.js sets inline styles on the video after async init.
    // style.setProperty(..., 'important') creates inline !important — beats JS-set inline styles.
    // Only touch the video, not the canvas — AR.js must manage the WebGL canvas itself.
    function fixVideo() {
      document.querySelectorAll('video').forEach(function(v) {
        v.style.setProperty('position',   'fixed',  'important');
        v.style.setProperty('top',        '0',       'important');
        v.style.setProperty('left',       '0',       'important');
        v.style.setProperty('width',      '100vw',   'important');
        v.style.setProperty('height',     '100vh',   'important');
        v.style.setProperty('object-fit', 'cover',   'important');
        v.style.setProperty('max-width',  'none',    'important');
        v.style.setProperty('max-height', 'none',    'important');
      });
    }
    // Run at key points during AR.js's async initialisation (no MutationObserver —
    // watching the subtree fires on every A-Frame render and kills detection).
    [0, 500, 1500, 3000].forEach(function(d) { setTimeout(fixVideo, d); });

    // ── Auth guard ── (delayed to allow localStorage to load)
    function checkAuth() {
      const token = localStorage.getItem('ar_token');
      if (!token && !window.location.pathname.includes('/ar/')) {
        console.warn('No auth token found, redirecting to login');
        window.location.href = '/ar/';
      }
    }
    // Delay auth check to allow localStorage to populate
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => setTimeout(checkAuth, 100));
    } else {
      setTimeout(checkAuth, 100);
    }

    const user = Auth.getUser();
    if (user) document.getElementById('topbar-user').textContent = user.name || user.email;

    // Default tool list (used if API inventory is empty)
    const DEFAULT_TOOLS = [
      { name: 'Torque Wrench',          category: 'hand_tool'  },
      { name: 'Voltage Tester',          category: 'electrical' },
      { name: 'Long-nose Pliers',        category: 'hand_tool'  },
      { name: 'Phillips Screwdriver',    category: 'hand_tool'  },
      { name: 'Flat-head Screwdriver',   category: 'hand_tool'  },
      { name: 'Cable Ties (Pack)',        category: 'consumable' },
      { name: 'Inspection Torch',         category: 'electrical' },
      { name: 'Hammer',                   category: 'hand_tool'  },
    ];

    // State
    let expectedTools  = [];   // { name, category, _id? }
    let detectedSet    = new Set();
    let markerActive   = false;

    // ── Init ─────────────────────────────────────────────────────
    window.addEventListener('load', async () => {
      await loadTools();
      renderToolList();
      setupMarker();
    });

    async function loadTools() {
      setLoading(true);
      const data = await API.getTools();
      setLoading(false);
      if (data.success && data.data.tools.length > 0) {
        expectedTools = data.data.tools.map(t => ({
          name: t.name, category: t.category, _id: t._id
        }));
      } else {
        expectedTools = [...DEFAULT_TOOLS];
      }
    }

    function setupMarker() {
      const marker = document.getElementById('tool-marker');
      const panel  = document.getElementById('tool-panel');

      marker.addEventListener('markerFound', () => {
        markerActive = true;
        document.getElementById('scan-hint').style.opacity = '0';
        panel.classList.remove('hidden');
        panel.classList.add('peek');
        updateAROverlay();
      });
      marker.addEventListener('markerLost', () => {
        markerActive = false;
        document.getElementById('scan-hint').style.opacity = '1';
        updateAROverlay();
      });
    }

    // ── Swipeable bottom sheet ────────────────────────────────────
    (function() {
      const panel  = document.getElementById('tool-panel');
      const handle = panel.querySelector('.panel-drag');
      let startY = 0;

      handle.addEventListener('touchstart', e => {
        startY = e.touches[0].clientY;
      }, { passive: true });

      handle.addEventListener('touchend', e => {
        const delta = e.changedTouches[0].clientY - startY;
        if (delta < -20) {
          panel.classList.remove('peek');   // swipe up → expand
        } else if (delta > 20) {
          panel.classList.add('peek');      // swipe down → collapse to peek
        } else {
          // tap → toggle
          panel.classList.toggle('peek');
        }
      }, { passive: true });
    })();

    // ── Render tool list ─────────────────────────────────────────
    function renderToolList() {
      const list = document.getElementById('tool-list');
      list.innerHTML = '';

      expectedTools.forEach(tool => {
        const isDetected = detectedSet.has(tool.name);

        const item = document.createElement('div');
        item.className = 'tool-item' + (isDetected ? ' detected' : '');
        item.id = 'tool-' + slugify(tool.name);

        item.innerHTML = `
          <div class="tool-checkbox"></div>
          <div class="tool-info">
            <div class="tool-name">${tool.name}</div>
            <div class="tool-cat">${tool.category.replace('_', ' ')}</div>
          </div>
          <button class="scan-btn ${isDetected ? 'active' : ''}"
                  onclick="toggleTool('${tool.name}')">
            ${isDetected ? 'Scanned ✓' : 'Scan'}
          </button>
        `;

        list.appendChild(item);
      });

      updateCount();
    }

    function toggleTool(name) {
      if (detectedSet.has(name)) {
        detectedSet.delete(name);
      } else {
        detectedSet.add(name);
        // Brief flash animation for feedback
        const item = document.getElementById('tool-' + slugify(name));
        if (item) {
          item.style.transition = 'background 0.1s';
          item.style.background = 'rgba(34,197,94,0.08)';
          setTimeout(() => { item.style.background = ''; }, 300);
        }
      }
      renderToolList();
      updateAROverlay();
    }

    function updateCount() {
      const detected = detectedSet.size;
      const total    = expectedTools.length;
      const badge    = document.getElementById('count-badge');
      badge.textContent = `${detected} / ${total}`;
      badge.className   = 'count-badge' + (
        detected === total ? ' all-done' :
        detected < total && detected > 0 ? '' : ''
      );
    }

    function updateAROverlay() {
      const detected = detectedSet.size;
      const total    = expectedTools.length;
      const allDone  = detected === total;
      const color    = '#22c55e';

      document.getElementById('ar-strip').setAttribute('color', color);
      document.getElementById('ar-frame').setAttribute('hud-frame', 'color', color);
      document.getElementById('ar-scan').setAttribute('color', color);
      document.getElementById('ar-icon').setAttribute('src', allDone ? '/ar/img/icon_none.png' : '/ar/img/icon_fault.png');
      document.getElementById('ar-count').setAttribute('value',  `${detected} / ${total} TOOLS`);
      document.getElementById('ar-status').setAttribute('value', allDone ? 'All tools accounted for' : `${total - detected} tool(s) remaining`);
      document.getElementById('ar-hint').setAttribute('value',   markerActive ? 'Tap each tool in the list' : 'Marker lost — keep scanning');
    }

    // Submit check handler
    async function submitCheck() {
      const btn = document.getElementById('submit-btn');
      btn.disabled = true; btn.textContent = 'Submitting…';
      setLoading(true);

      const detected = expectedTools.filter(t => detectedSet.has(t.name));
      const checkType = document.getElementById('check-type').value;

      const payload = {
        checkType,
        depot: 'Central Depot',
        expectedTools: expectedTools.map(t => ({
          name: t.name,
          ...(t._id ? { tool: t._id } : {})
        })),
        detectedTools: detected.map(t => ({
          name: t.name,
          ...(t._id ? { tool: t._id } : {})
        })),
        notes: `AR tool check — ${detected.length}/${expectedTools.length} tools scanned`
      };

      const res = await API.submitToolCheck(payload);
      setLoading(false);
      btn.disabled = false; btn.textContent = 'Submit Tool Check';

      if (res.success) {
        showResult(res.data.toolCheck);
      } else {
        toast(res.message, 'error');
      }
    }

    function showResult(check) {
      const passed   = check.passed;
      const missing  = check.missingTools || [];

      document.getElementById('result-icon').textContent  = passed ? '✅' : '❌';
      document.getElementById('result-title').textContent = passed ? 'Check Passed' : 'Check Failed';
      document.getElementById('result-msg').textContent   = passed
        ? `All ${check.totalExpected} tools accounted for.`
        : `${check.totalMissing} tool(s) missing from the expected inventory.`;

      const missingEl = document.getElementById('missing-list');
      if (missing.length > 0) {
        missingEl.innerHTML = missing.map(t =>
          `<div class="missing-item">⚠ ${t.name} — not detected</div>`
        ).join('');
      } else {
        missingEl.innerHTML = '';
      }

      document.getElementById('modal-result').classList.remove('hidden');
    }

    function closeResult() {
      document.getElementById('modal-result').classList.add('hidden');
    }

    function resetCheck() {
      detectedSet.clear();
      closeResult();
      renderToolList();
      updateAROverlay();
    }

    // Helper functions
    function slugify(str) {
      return str.toLowerCase().replace(/[^a-z0-9]/g, '-');
    }
    function setLoading(on) {
      document.getElementById('loading-bar').style.display = on ? 'block' : 'none';
    }
    let toastTimer;
    function toast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg; el.className = type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 3000);
    }
  </script>
</body>
</html>
